<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Intent Classification API on AWS</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1100" height="580" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Intent Classification API: AWS Architecture</text>
  <text x="550" y="54" text-anchor="middle" font-size="13" fill="#475569">FastAPI service that classifies support messages into 9 intents (TF-IDF + Logistic Regression)</text>

  <!-- AWS region -->
  <rect x="160" y="72" width="925" height="326" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="176" y="93" font-size="13" font-weight="600" fill="#475569">AWS Region: us-east-1</text>

  <!-- Client -->
  <rect x="20" y="200" width="110" height="70" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="75" y="231" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">Client</text>
  <text x="75" y="250" text-anchor="middle" font-size="11" fill="#475569" font-family="ui-monospace, Menlo, Consolas, monospace">POST /predict</text>

  <!-- ALB -->
  <rect x="185" y="195" width="130" height="80" rx="10" fill="#fff4e8" stroke="#ED7100" stroke-width="2"/>
  <text x="250" y="226" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Application</text>
  <text x="250" y="244" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Load Balancer</text>
  <text x="250" y="262" text-anchor="middle" font-size="12" fill="#475569" font-family="ui-monospace, Menlo, Consolas, monospace">HTTP:80</text>

  <!-- Target group -->
  <rect x="355" y="195" width="130" height="80" rx="10" fill="#fff4e8" stroke="#ED7100" stroke-width="2"/>
  <text x="420" y="226" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Target Group</text>
  <text x="420" y="246" text-anchor="middle" font-size="11" fill="#475569">Health check:</text>
  <text x="420" y="262" text-anchor="middle" font-size="12" fill="#475569" font-family="ui-monospace, Menlo, Consolas, monospace">GET /health</text>

  <!-- Auto Scaling Group -->
  <rect x="525" y="104" width="545" height="272" rx="12" fill="#ffffff" stroke="#ED7100" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="543" y="127" font-size="14" font-weight="700" fill="#c2410c">Auto Scaling Group</text>

  <!-- EC2 a -->
  <rect x="545" y="138" width="505" height="104" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="560" y="158" font-size="12" font-weight="600" fill="#1d4ed8">EC2 t3.small · us-east-1a</text>
  <g font-size="12" text-anchor="middle" fill="#0f172a">
    <rect x="560" y="168" width="105" height="56" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="612" y="192" font-weight="600">nginx :80</text><text x="612" y="210" font-size="11" fill="#475569">reverse proxy</text>
    <rect x="687" y="168" width="105" height="56" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="739" y="192" font-weight="600">Uvicorn :8000</text><text x="739" y="210" font-size="11" fill="#475569">systemd service</text>
    <rect x="814" y="168" width="105" height="56" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="866" y="192" font-weight="600">FastAPI app</text><text x="866" y="210" font-size="11" fill="#475569">/health · /predict</text>
    <rect x="941" y="168" width="105" height="56" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="993" y="192" font-weight="600" font-size="11">TF-IDF + LogReg</text><text x="993" y="210" font-size="11" fill="#475569">joblib models</text>
  </g>
  <line x1="665" y1="196" x2="685" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-s)"/>
  <line x1="792" y1="196" x2="812" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-s)"/>
  <line x1="919" y1="196" x2="939" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-s)"/>

  <!-- EC2 b -->
  <rect x="545" y="256" width="505" height="104" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="560" y="276" font-size="12" font-weight="600" fill="#1d4ed8">EC2 t3.small · us-east-1b</text>
  <g font-size="12" text-anchor="middle" fill="#0f172a">
    <rect x="560" y="286" width="105" height="56" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="612" y="310" font-weight="600">nginx :80</text><text x="612" y="328" font-size="11" fill="#475569">reverse proxy</text>
    <rect x="687" y="286" width="105" height="56" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="739" y="310" font-weight="600">Uvicorn :8000</text><text x="739" y="328" font-size="11" fill="#475569">systemd service</text>
    <rect x="814" y="286" width="105" height="56" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="866" y="310" font-weight="600">FastAPI app</text><text x="866" y="328" font-size="11" fill="#475569">/health · /predict</text>
    <rect x="941" y="286" width="105" height="56" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="993" y="310" font-weight="600" font-size="11">TF-IDF + LogReg</text><text x="993" y="328" font-size="11" fill="#475569">joblib models</text>
  </g>
  <line x1="665" y1="314" x2="685" y2="314" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-s)"/>
  <line x1="792" y1="314" x2="812" y2="314" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-s)"/>
  <line x1="919" y1="314" x2="939" y2="314" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-s)"/>

  <!-- Request path arrows -->
  <line x1="130" y1="235" x2="183" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="315" y1="235" x2="353" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M485,235 H505 V190 H543" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M505,235 V308 H543" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Build and bootstrap row -->
  <text x="20" y="428" font-size="13" font-weight="700" fill="#475569">Build and deploy</text>

  <rect x="20" y="440" width="300" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="170" y="464" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Offline training</text>
  <text x="170" y="486" text-anchor="middle" font-size="12" fill="#334155" font-family="ui-monospace, Menlo, Consolas, monospace">train.py + data/intent.csv</text>
  <text x="170" y="506" text-anchor="middle" font-size="12" fill="#334155">TF-IDF + Logistic Regression</text>
  <text x="170" y="526" text-anchor="middle" font-size="12" fill="#334155" font-family="ui-monospace, Menlo, Consolas, monospace">model/*.joblib</text>

  <rect x="400" y="440" width="300" height="110" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="550" y="464" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">GitHub: mr-gul/intent_classifier</text>
  <text x="550" y="486" text-anchor="middle" font-size="12" fill="#334155">branch</text>
  <text x="550" y="506" text-anchor="middle" font-size="12" fill="#334155" font-family="ui-monospace, Menlo, Consolas, monospace">virtual_machine</text>
  <text x="550" y="526" text-anchor="middle" font-size="11" fill="#475569">app/ · model/ · userdata.sh</text>

  <rect x="780" y="440" width="300" height="110" rx="10" fill="#fff4e8" stroke="#ED7100" stroke-width="1.5"/>
  <text x="930" y="464" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">EC2 user data (userdata.sh)</text>
  <text x="930" y="486" text-anchor="middle" font-size="12" fill="#334155">apt install nginx, python3-venv, git</text>
  <text x="930" y="504" text-anchor="middle" font-size="12" fill="#334155">git clone, venv + pip install</text>
  <text x="930" y="522" text-anchor="middle" font-size="12" fill="#334155">systemd unit + nginx proxy config</text>

  <line x1="320" y1="495" x2="398" y2="495" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="359" y="487" text-anchor="middle" font-size="11" fill="#475569">commit</text>
  <line x1="700" y1="495" x2="778" y2="495" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="739" y="487" text-anchor="middle" font-size="11" fill="#475569">clone</text>

  <!-- Bootstrap arrow up into the ASG -->
  <path d="M930,440 V376" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="918" y="420" text-anchor="end" font-size="11" fill="#475569">bootstraps each instance on launch</text>
</svg>
