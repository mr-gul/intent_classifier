<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 575" width="1100" height="575" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Intent Classification API: Docker, Kubernetes and CI/CD</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1100" height="575" fill="#ffffff"/>
  <text x="550" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Intent Classification API: Docker, Kubernetes and CI/CD</text>
  <text x="550" y="50" text-anchor="middle" font-size="13" fill="#475569">FastAPI service (TF-IDF + Logistic Regression) built and deployed with GitHub Actions</text>

  <!-- CI/CD region -->
  <rect x="10" y="62" width="1080" height="146" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="26" y="82" font-size="13" font-weight="600" fill="#475569">GitHub Actions: .github/workflows/ci-cd.yml</text>

  <g text-anchor="middle" fill="#0f172a">
    <rect x="20" y="92" width="235" height="86" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="137" y="114" font-size="14" font-weight="600">Trigger</text>
    <text x="137" y="134" font-size="11.5" fill="#334155">push to master, tag v*.*.*,</text>
    <text x="137" y="150" font-size="11.5" fill="#334155">pull request, or manual run</text>

    <rect x="295" y="92" width="235" height="86" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="412" y="114" font-size="14" font-weight="600">1. Test</text>
    <text x="412" y="134" font-size="11.5" fill="#334155">pytest on Python 3.12</text>
    <text x="412" y="150" font-size="11.5" fill="#334155">runs on every trigger</text>

    <rect x="570" y="92" width="235" height="86" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="687" y="114" font-size="14" font-weight="600">2. Build and publish image</text>
    <text x="687" y="134" font-size="11.5" fill="#334155">Docker Buildx, push to GHCR</text>
    <text x="687" y="150" font-size="11.5" fill="#334155">smoke test: GET /health</text>

    <rect x="845" y="92" width="235" height="86" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="962" y="114" font-size="14" font-weight="600">3. Deploy</text>
    <text x="962" y="134" font-size="11.5" fill="#334155">self-hosted runner: kubectl apply,</text>
    <text x="962" y="150" font-size="11.5" fill="#334155">set image, rollout status</text>
  </g>
  <line x1="255" y1="135" x2="293" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="135" x2="568" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="805" y1="135" x2="843" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="550" y="198" text-anchor="middle" font-size="11" fill="#475569">Pull requests run tests only. Image and deploy jobs run on push or manual run; deploy also needs ENABLE_DEPLOY=true.</text>

  <!-- GHCR -->
  <rect x="15" y="250" width="140" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="85" y="272" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">GHCR</text>
  <text x="85" y="292" text-anchor="middle" font-size="11" fill="#334155">ghcr.io/mr-gul/</text>
  <text x="85" y="307" text-anchor="middle" font-size="11" fill="#334155">intent_classifier</text>

  <!-- Kubernetes cluster -->
  <rect x="170" y="250" width="920" height="300" rx="12" fill="#f8fafc" stroke="#326ce5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="186" y="270" font-size="13" font-weight="600" fill="#1d4ed8">Kubernetes cluster · namespace: default</text>

  <!-- Developer -->
  <rect x="15" y="360" width="140" height="80" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="85" y="384" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Developer</text>
  <text x="85" y="404" text-anchor="middle" font-size="11" fill="#334155">port-forward 8000</text>
  <text x="85" y="420" text-anchor="middle" font-size="11" fill="#334155">Swagger UI at /docs</text>

  <!-- Service -->
  <rect x="200" y="360" width="170" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="285" y="384" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Service</text>
  <text x="285" y="404" text-anchor="middle" font-size="12" fill="#334155">intent-classifier</text>
  <text x="285" y="421" text-anchor="middle" font-size="11" fill="#475569" font-family="ui-monospace, Menlo, Consolas, monospace">ClusterIP :8000</text>

  <!-- Deployment -->
  <rect x="410" y="282" width="665" height="250" rx="12" fill="#ffffff" stroke="#326ce5" stroke-width="2"/>
  <text x="426" y="302" font-size="14" font-weight="700" fill="#1d4ed8">Deployment intent-classifier · replicas: 2</text>
  <text x="1060" y="302" text-anchor="end" font-size="11" fill="#475569">readiness + liveness probes: GET /health</text>

  <!-- Pod 1 -->
  <rect x="425" y="314" width="635" height="94" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="440" y="333" font-size="12" font-weight="600" fill="#1d4ed8">Pod 1</text>
  <g font-size="12" text-anchor="middle" fill="#0f172a">
    <rect x="440" y="344" width="185" height="54" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="532" y="366" font-weight="600">Uvicorn :8000</text><text x="532" y="384" font-size="11" fill="#475569">python:3.12-slim image</text>
    <rect x="655" y="344" width="185" height="54" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="747" y="366" font-weight="600">FastAPI app</text><text x="747" y="384" font-size="11" fill="#475569">/health · /predict</text>
    <rect x="870" y="344" width="185" height="54" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="962" y="366" font-weight="600">TF-IDF + LogReg</text><text x="962" y="384" font-size="11" fill="#475569">model/*.joblib</text>
  </g>
  <line x1="625" y1="371" x2="653" y2="371" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-s)"/>
  <line x1="840" y1="371" x2="868" y2="371" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-s)"/>

  <!-- Pod 2 -->
  <rect x="425" y="424" width="635" height="94" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="440" y="443" font-size="12" font-weight="600" fill="#1d4ed8">Pod 2</text>
  <g font-size="12" text-anchor="middle" fill="#0f172a">
    <rect x="440" y="454" width="185" height="54" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="532" y="476" font-weight="600">Uvicorn :8000</text><text x="532" y="494" font-size="11" fill="#475569">python:3.12-slim image</text>
    <rect x="655" y="454" width="185" height="54" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="747" y="476" font-weight="600">FastAPI app</text><text x="747" y="494" font-size="11" fill="#475569">/health · /predict</text>
    <rect x="870" y="454" width="185" height="54" rx="8" fill="#ffffff" stroke="#3b82f6"/>
    <text x="962" y="476" font-weight="600">TF-IDF + LogReg</text><text x="962" y="494" font-size="11" fill="#475569">model/*.joblib</text>
  </g>
  <line x1="625" y1="481" x2="653" y2="481" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-s)"/>
  <line x1="840" y1="481" x2="868" y2="481" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow-s)"/>

  <!-- Traffic arrows -->
  <line x1="155" y1="400" x2="198" y2="400" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M370,400 H392 V361 H424" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M392,400 V471 H424" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Image pull -->
  <path d="M155,291 H408" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="282" y="285" text-anchor="middle" font-size="11" fill="#475569">pulls image</text>

  <!-- CI to registry and cluster -->
  <path d="M687,178 V228 H85 V248" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="386" y="222" text-anchor="middle" font-size="11" fill="#475569">push image</text>
  <path d="M962,178 V280" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="952" y="242" text-anchor="end" font-size="11" fill="#475569">kubectl apply, set image</text>
</svg>
